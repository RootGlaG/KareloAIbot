services:
  - type: web
    name: telegram-moderation-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: MODERATE_ALL
        value: "true"
